name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nowy push na ten sam ref anuluje trwajacy bieg (oszczednosc minut runnera).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + typecheck + tests (py3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Sanity Os 0: numba==0.65.1 byla weryfikowana tylko na Win11 (CLAUDE.md).
      # Tu potwierdzamy, ze ta sama pinowana wersja dziala na ubuntu + numpy 2.x.
      - name: Environment sanity (Numba + numpy 2.x)
        run: pytest tests/test_environment.py -q

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy --strict)
        run: mypy src

      - name: Tests (pytest)
        run: pytest -q
